services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-helpdesk}
      POSTGRES_USER: ${DB_USERNAME:-helpdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helpdesk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: helpdesk-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-helpdesk}
      DB_USERNAME: ${DB_USERNAME:-helpdesk}
      DB_PASSWORD: ${DB_PASSWORD:-helpdesk}
      JWT_SECRET: ${JWT_SECRET:-7tZ6Vbv0LDUWWc8wBX6iPiPIWgG9ncbPjz/uD5Jw4Y1bGKIkMxe3Q4vZhEmGZ0ZLqDMlEn+dtyxuZR2V/je3JQ==}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
